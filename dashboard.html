<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IOT2050 — Dashboard S7-1500</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0a0e14;
      --panel:     #111820;
      --border:    #1e2d3d;
      --accent:    #00d4ff;
      --accent2:   #ff6b35;
      --green:     #39ff14;
      --text:      #c8d6e5;
      --muted:     #4a6278;
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Barlow', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,14,20,0.85);
      backdrop-filter: blur(8px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      box-shadow: 0 0 12px rgba(0,212,255,0.3);
    }

    .logo-text {
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* Status indicator */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.connected {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: var(--accent2);
      box-shadow: 0 0 8px var(--accent2);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #status-text { color: var(--muted); }

    .timestamp {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      border-left: 1px solid var(--border);
      padding-left: 16px;
    }

    /* ── MAIN ── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* ── CARDS ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before { opacity: 1; }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-label {
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .card-value {
      font-family: var(--font-mono);
      font-size: 52px;
      font-weight: 400;
      color: var(--text);
      line-height: 1;
      transition: color 0.3s;
    }

    .card-value.updated {
      color: var(--accent);
      animation: flash 0.5s ease;
    }

    @keyframes flash {
      0%   { text-shadow: 0 0 20px var(--accent); }
      100% { text-shadow: none; }
    }

    .card-unit {
      font-family: var(--font-mono);
      font-size: 16px;
      color: var(--muted);
      margin-left: 6px;
    }

    .card-type {
      margin-top: 12px;
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      padding: 14px 32px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">IOT</div>
    <div>
      <div class="logo-text">IOT2050 Monitor</div>
      <div class="logo-sub">S7-1500 · OPC-UA · MQTT</div>
    </div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">DISCONNECTED</span>
    <div class="timestamp" id="last-update">--:--:--</div>
  </div>
</header>

<main>

  <!-- Valeurs temps réel -->
  <div>
    <div class="section-label">// Valeurs temps réel</div>
    <div class="cards">

      <div class="card">
        <div class="card-tag">VAR_1</div>
        <div class="card-label">T2606/Test/Var1</div>
        <div>
          <span class="card-value" id="val1">--</span>
          <span class="card-unit"></span>
        </div>
        <div class="card-type">REAL · Float</div>
        <div class="card-bar">
        </div>
      </div>

      <div class="card">
        <div class="card-tag">VAR_2</div>
        <div class="card-label">T2606/Test/Var2</div>
        <div>
          <span class="card-value" id="val2">--</span>
          <span class="card-unit"></span>
        </div>
        <div class="card-type">USINT · Unsigned Int</div>
        <div class="card-bar">
        </div>
      </div>

      <div class="card">
        <div class="card-tag">VAR_3</div>
        <div class="card-label">T2606/Test/Var3</div>
        <div>
          <span class="card-value" id="val3">--</span>
          <span class="card-unit"></span>
        </div>
        <div class="card-type">USINT ·  Intager</div>
        <div class="card-bar">
        </div>
      </div>

    </div>
  </div>
</main>

<footer>
  <span>broker.hivemq.com:8884 · T2606/Test/Var1 · T2606/Test/Var2</span>
</footer>

<script>
  // ── Configuration ──────────────────────────────────────────
  const BROKER  = 'wss://broker.hivemq.com:8884/mqtt';
  const TOPIC1  = 'T2606/Test/Var1';
  const TOPIC2  = 'T2606/Test/Var2';
  const TOPIC3  = 'T2606/Test/Var3';
 
  // ── État ───────────────────────────────────────────────────
  

  // ── Éléments DOM ───────────────────────────────────────────
  const elVal1      = document.getElementById('val1');
  const elVal2      = document.getElementById('val2');
  const elVal3      = document.getElementById('val3');
  const elDot       = document.getElementById('status-dot');
  const elStatus    = document.getElementById('status-text');
  const elUpdate    = document.getElementById('last-update');
  
  // ── Connexion MQTT ─────────────────────────────────────────

  const client = mqtt.connect(BROKER, {
    clientId: 'dashboard_' + Math.random().toString(16).slice(2, 8),
    clean: true,
    reconnectPeriod: 3000,
  });

  client.on('connect', () => {
    elDot.className    = 'status-dot connected';
    elStatus.textContent = 'CONNECTED';
    client.subscribe(TOPIC1, err => {
    });
    client.subscribe(TOPIC2, err => {
    });
    client.subscribe(TOPIC3, err => {
    });
  });

  client.on('error', err => {
    elDot.className    = 'status-dot error';
    elStatus.textContent = 'ERROR';
  });

  client.on('offline', () => {
    elDot.className    = 'status-dot';
    elStatus.textContent = 'DISCONNECTED';
  });

  client.on('reconnect', () => {
    elStatus.textContent = 'RECONNECTING...';
  });

  client.on('message', (topic, message) => {
    try {
      const value = parseFloat(message.toString());
      const now   = new Date().toLocaleTimeString('fr-CH');

      if (topic === TOPIC1) {
        elVal1.textContent = isNaN(value) ? message.toString() : value.toFixed(2);
      }

      if (topic === TOPIC2) {
        elVal2.textContent = isNaN(value) ? message.toString() : parseInt(value);
      }

      if (topic === TOPIC3) {
        elVal3.textContent = isNaN(value) ? message.toString() : parseInt(value);
      }

      elUpdate.textContent = now;
    } catch (e) {
    }
  });
</script>
</body>
</html>
