<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IOT2050 — Dashboard S7-1500</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0a0e14;
      --panel:     #111820;
      --border:    #1e2d3d;
      --accent:    #00d4ff;
      --accent2:   #ff6b35;
      --green:     #39ff14;
      --text:      #c8d6e5;
      --muted:     #4a6278;
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Barlow', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,14,20,0.85);
      backdrop-filter: blur(8px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      box-shadow: 0 0 12px rgba(0,212,255,0.3);
    }

    .logo-text {
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* Status indicator */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.connected {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: var(--accent2);
      box-shadow: 0 0 8px var(--accent2);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #status-text { color: var(--muted); }

    .timestamp {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      border-left: 1px solid var(--border);
      padding-left: 16px;
    }

    /* ── MAIN ── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    /* ── CARDS ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before { opacity: 1; }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-label {
      font-size: 13px;
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .card-value {
      font-family: var(--font-mono);
      font-size: 52px;
      font-weight: 400;
      color: var(--text);
      line-height: 1;
      transition: color 0.3s;
    }

    .card-value.updated {
      color: var(--accent);
      animation: flash 0.5s ease;
    }

    @keyframes flash {
      0%   { text-shadow: 0 0 20px var(--accent); }
      100% { text-shadow: none; }
    }

    .card-unit {
      font-family: var(--font-mono);
      font-size: 16px;
      color: var(--muted);
      margin-left: 6px;
    }

    .card-type {
      margin-top: 12px;
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
    }

    /* Bar indicator */
    .card-bar {
      margin-top: 16px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .card-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      width: 0%;
      transition: width 0.6s ease;
    }

    /* ── CHART ── */
    .chart-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .chart-title {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .chart-legend {
      display: flex;
      gap: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    .legend-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }

    canvas {
      width: 100% !important;
      height: 180px !important;
    }

    /* ── LOG ── */
    .log-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .log-title {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .log-clear {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .log-clear:hover { color: var(--accent2); border-color: var(--accent2); }

    #log {
      height: 160px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.8;
    }

    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-entry { color: var(--muted); }
    .log-entry .log-time { color: var(--accent); margin-right: 8px; }
    .log-entry .log-msg  { color: var(--text); }
    .log-entry.log-error .log-msg { color: var(--accent2); }
    .log-entry.log-ok    .log-msg { color: var(--green); }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      padding: 14px 32px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">IOT</div>
    <div>
      <div class="logo-text">IOT2050 Monitor</div>
      <div class="logo-sub">S7-1500 · OPC-UA · MQTT</div>
    </div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">DISCONNECTED</span>
    <div class="timestamp" id="last-update">--:--:--</div>
  </div>
</header>

<main>

  <!-- Valeurs temps réel -->
  <div>
    <div class="section-label">// Valeurs temps réel</div>
    <div class="cards">

      <div class="card">
        <div class="card-tag">VAR_1</div>
        <div class="card-label">T2606/Test/Var1</div>
        <div>
          <span class="card-value" id="val1">--</span>
          <span class="card-unit"></span>
        </div>
        <div class="card-type">REAL · Float</div>
        <div class="card-bar">
          <div class="card-bar-fill" id="bar1"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-tag">VAR_2</div>
        <div class="card-label">T2606/Test/Var2</div>
        <div>
          <span class="card-value" id="val2">--</span>
          <span class="card-unit"></span>
        </div>
        <div class="card-type">USINT · Unsigned Int</div>
        <div class="card-bar">
          <div class="card-bar-fill" id="bar2" style="background: linear-gradient(90deg, var(--accent2), #ff9f1c);"></div>
        </div>
      </div>

    </div>
  </div>

 

</main>

<footer>
  <span>broker.hivemq.com:8000 · T2606/Test/Var1 · T2606/Test/Var2</span>
  <span id="msg-count">0 messages reçus</span>
</footer>

<script>
  // ── Configuration ──────────────────────────────────────────
  const BROKER  = 'wss://broker.hivemq.com:8884/mqtt';
  const TOPIC1  = 'T2606/Test/Var1';
  const TOPIC2  = 'T2606/Test/Var2';
  const MAX_PTS = 30; // points dans le graphique

  // ── État ───────────────────────────────────────────────────
  let msgCount = 0;
  const history = { val1: [], val2: [], labels: [] };

  // ── Éléments DOM ───────────────────────────────────────────
  const elVal1      = document.getElementById('val1');
  const elVal2      = document.getElementById('val2');
  const elBar1      = document.getElementById('bar1');
  const elBar2      = document.getElementById('bar2');
  const elDot       = document.getElementById('status-dot');
  const elStatus    = document.getElementById('status-text');
  const elUpdate    = document.getElementById('last-update');
  const elMsgCount  = document.getElementById('msg-count');
  const elLog       = document.getElementById('log');

  // ── Graphique canvas ───────────────────────────────────────
  const canvas = document.getElementById('chart');
  const ctx    = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width  = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); drawChart(); });

  function drawChart() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    if (history.val1.length < 2) return;

    const datasets = [
      { data: history.val1, color: '#00d4ff' },
      { data: history.val2, color: '#ff6b35' },
    ];

    datasets.forEach(({ data, color }) => {
      if (data.length < 2) return;

      const all  = [...history.val1, ...history.val2].filter(v => v !== null);
      const minV = Math.min(...all);
      const maxV = Math.max(...all) || 1;
      const range = maxV - minV || 1;

      const pts = data.map((v, i) => ({
        x: (i / (data.length - 1)) * w,
        y: h - ((v - minV) / range) * (h - 20) - 10
      }));

      // Zone remplie
      ctx.beginPath();
      ctx.moveTo(pts[0].x, h);
      pts.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(pts[pts.length - 1].x, h);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, color + '33');
      grad.addColorStop(1, color + '00');
      ctx.fillStyle = grad;
      ctx.fill();

      // Ligne
      ctx.beginPath();
      pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.strokeStyle = color;
      ctx.lineWidth   = 2;
      ctx.stroke();

      // Point final
      const last = pts[pts.length - 1];
      ctx.beginPath();
      ctx.arc(last.x, last.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    });
  }

  // ── Log ────────────────────────────────────────────────────
  function addLog(msg, type = '') {
    const now  = new Date().toLocaleTimeString('fr-CH');
    const div  = document.createElement('div');
    div.className = `log-entry ${type}`;
    div.innerHTML = `<span class="log-time">[${now}]</span><span class="log-msg">${msg}</span>`;
    elLog.prepend(div);
    // Garder max 50 lignes
    while (elLog.children.length > 50) elLog.removeChild(elLog.lastChild);
  }

  function clearLog() { elLog.innerHTML = ''; }

  // ── Barre de progression ───────────────────────────────────
  function updateBar(el, value, max) {
    const pct = Math.min(100, Math.max(0, (value / max) * 100));
    el.style.width = pct + '%';
  }

  

  // ── Connexion MQTT ─────────────────────────────────────────
  addLog('Connexion à ' + BROKER + '...', '');

  const client = mqtt.connect(BROKER, {
    clientId: 'dashboard_' + Math.random().toString(16).slice(2, 8),
    clean: true,
    reconnectPeriod: 3000,
  });

  client.on('connect', () => {
    elDot.className    = 'status-dot connected';
    elStatus.textContent = 'CONNECTED';
    addLog('Connecté au broker HiveMQ', 'log-ok');
    client.subscribe(TOPIC1, err => {
      if (err) addLog('Erreur abonnement: ' + err.message, 'log-error');
      else     addLog('Abonné au topic: ' + TOPIC1, 'log-ok');
    });
    client.subscribe(TOPIC2, err => {
      if (err) addLog('Erreur abonnement: ' + err.message, 'log-error');
      else     addLog('Abonné au topic: ' + TOPIC2, 'log-ok');
    });
  });

  client.on('error', err => {
    elDot.className    = 'status-dot error';
    elStatus.textContent = 'ERROR';
    addLog('Erreur: ' + err.message, 'log-error');
  });

  client.on('offline', () => {
    elDot.className    = 'status-dot';
    elStatus.textContent = 'DISCONNECTED';
    addLog('Déconnecté du broker', 'log-error');
  });

  client.on('reconnect', () => {
    elStatus.textContent = 'RECONNECTING...';
    addLog('Tentative de reconnexion...', '');
  });

  client.on('message', (topic, message) => {
    try {
      const value = parseFloat(message.toString());
      const now   = new Date().toLocaleTimeString('fr-CH');

      if (topic === TOPIC1) {
        elVal1.textContent = isNaN(value) ? message.toString() : value.toFixed(2);
        flashValue(elVal1);
        updateBar(elBar1, Math.abs(value), 100);
        history.val1.push(isNaN(value) ? 0 : value);
        if (history.val1.length > MAX_PTS) history.val1.shift();
        addLog('Var1 = ' + elVal1.textContent, '');
      }

      if (topic === TOPIC2) {
        elVal2.textContent = isNaN(value) ? message.toString() : parseInt(value);
        flashValue(elVal2);
        updateBar(elBar2, Math.abs(value), 255);
        history.val2.push(isNaN(value) ? 0 : value);
        if (history.val2.length > MAX_PTS) history.val2.shift();
        addLog('Var2 = ' + elVal2.textContent, '');
      }

      elUpdate.textContent = now;
      msgCount++;
      elMsgCount.textContent = msgCount + ' messages reçus';
      drawChart();

    } catch (e) {
      addLog('Erreur: ' + e.message, 'log-error');
    }
  });
</script>
</body>
</html>
